name: Regime Signal Init (one-time)

# 用途: RegimeSignal テーブル作成 + 過去 10 年分の初期 backfill。
# 通常運用は us-daily.yml（直近 60 日のみ更新）に任せる。
# このワークフローは初期化時 / 全期間再計算が必要なときに手動実行する。

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Backfill 対象日数（10 年初期化なら 3650）"
        required: false
        default: "3650"

jobs:
  regime-init:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Apply Prisma migrations (migrate deploy)
        run: npx prisma migrate deploy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Initial regime backfill
        run: python scripts/regime/compute_regime.py --days ${{ inputs.days }}

      - name: Notify Slack on success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "✅ Regime Signal Init 成功"
          SLACK_MESSAGE: |
            RegimeSignal テーブルの migrate deploy + 初期 backfill (--days ${{ inputs.days }}) が完了しました。
          SLACK_COLOR: good
          SLACK_FOOTER: "auto-us-stock-trader"

      - name: Notify Slack on failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "❌ Regime Signal Init 失敗"
          SLACK_MESSAGE: |
            RegimeSignal の migrate deploy または初期 backfill でエラーが発生しました。
            詳細は GitHub Actions ログを確認してください。
          SLACK_COLOR: danger
          SLACK_FOOTER: "auto-us-stock-trader"
