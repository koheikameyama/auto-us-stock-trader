name: US Social Post

# 日次 SNS 投稿 + 局面変化アラート。cron-job.org から NY 18:30 平日に workflow_dispatch。
# 局面は DB にある最新足で判定するため、us-daily backfill（NY 18:00 開始・3〜7 分）の
# 完了後に置く。これより前に投稿すると当日足が入っておらず前日の局面を出してしまう。
# GitHub Actions の cron は UTC 固定で DST 揺れ + 遅延するため使わない（他の US ワークフローと同方針）。
# スケジュール定義は scripts/setup-cron-job.ts の JOBS が正（America/New_York 指定で DST 自動追従）。
on:
  workflow_dispatch: {}

jobs:
  social-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SNS_POST_SLACK_WEBHOOK_URL: ${{ secrets.SNS_POST_SLACK_WEBHOOK_URL }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      THREADS_USER_TOKEN: ${{ secrets.THREADS_USER_TOKEN }}
      PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Daily SNS post + regime-change alert
        run: npx tsx src/jobs/us-social-post.ts
