name: Paper Trading Daily Cycle

on:
  workflow_dispatch: {}

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # PrismaClient 用の URL（?schema= 付き）。Secret 自体は schema 無しで管理し、ここで合成する。
      DATABASE_URL: ${{ secrets.DATABASE_URL }}?schema=auto_us_stock_trader
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      ALPACA_API_ENDPOINT: ${{ secrets.ALPACA_API_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run paper-trading daily cycle
        run: npx tsx src/paper-trading/daily-runner.ts

      # IV skew は VIX regime 依存で、スパイク時の値は事後に再現できない（KOH-544）。
      # 取引サイクルの成否と独立に記録する（kill switch で停止中でもサンプルは貯める）。
      - name: Record IV skew snapshot
        id: record-skew
        if: always()
        continue-on-error: true
        run: npx tsx src/paper-trading/record-skew.ts

      - name: Notify Slack on skew record failure
        if: always() && steps.record-skew.outcome == 'failure'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "⚠️ IV skew スナップショット記録に失敗"
          SLACK_MESSAGE: |
            record-skew.ts が失敗しました（取引サイクルには影響しません）。
            当日分の skew サンプルが欠測します。VIX スパイク中なら市場時間内に手動実行を検討してください。
          SLACK_COLOR: warning
          SLACK_FOOTER: "auto-us-stock-trader"

      - name: Notify Slack on failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "❌ Paper Trading Daily 失敗"
          SLACK_MESSAGE: |
            paper-trading の daily-runner でエラーが発生しました。
            詳細は GitHub Actions ログを確認してください。
          SLACK_COLOR: danger
          SLACK_FOOTER: "auto-us-stock-trader"
