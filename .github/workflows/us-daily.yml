name: US Daily Backfill

on:
  # GitHub Actions の cron は UTC 固定で DST 揺れる + 5-15min 遅延のため、
  # 起動は cron-job.org から workflow_dispatch を叩く構成に移行（タイムゾーン対応・高精度）。
  # schedule:
  #   - cron: "0 22 * * 1-5"  # 旧: UTC 22:00 = NY 17:00 EST / 18:00 EDT
  workflow_dispatch: {}

jobs:
  backfill-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill S&P 500 daily bars
        run: python scripts/data/backfill_daily_bars.py --index sp500 --yes

      - name: Backfill S&P 600 daily bars
        run: python scripts/data/backfill_daily_bars.py --index sp600 --yes

      - name: Backfill index data (^GSPC, ^VIX)
        run: python scripts/data/backfill_index.py --yes

      - name: Backfill VIX-related ETFs
        run: python scripts/data/backfill_vol_etfs.py

      - name: Backfill rotation ETFs
        run: python scripts/data/backfill_rotation_etfs.py

      - name: Compute regime signal (Risk-on/off)
        run: python scripts/regime/compute_regime.py

      - name: Get DB counts
        id: counts
        if: success()
        run: |
          STOCK=$(python -c "import os,psycopg2;c=psycopg2.connect(os.environ['DATABASE_URL']).cursor();c.execute('SELECT COUNT(*), MAX(date) FROM auto_us_stock_trader.\"StockDailyBar\"');n,d=c.fetchone();print(f'{n:,} rows (max {d})')")
          INDEX=$(python -c "import os,psycopg2;c=psycopg2.connect(os.environ['DATABASE_URL']).cursor();c.execute('SELECT COUNT(*), MAX(date) FROM auto_us_stock_trader.\"IndexDailyBar\"');n,d=c.fetchone();print(f'{n:,} rows (max {d})')")
          echo "stock=$STOCK" >> $GITHUB_OUTPUT
          echo "index=$INDEX" >> $GITHUB_OUTPUT

      - name: Notify Slack on success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "✅ US Daily Backfill 成功"
          SLACK_MESSAGE: |
            StockDailyBar: ${{ steps.counts.outputs.stock }}
            IndexDailyBar: ${{ steps.counts.outputs.index }}
          SLACK_COLOR: good
          SLACK_FOOTER: "auto-us-stock-trader"

      - name: Notify Slack on failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "❌ US Daily Backfill 失敗"
          SLACK_MESSAGE: |
            米国データのバックフィルでエラーが発生しました。
            詳細は GitHub Actions ログを確認してください。
          SLACK_COLOR: danger
          SLACK_FOOTER: "auto-us-stock-trader"
