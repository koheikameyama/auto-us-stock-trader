name: US Daily Backfill

on:
  schedule:
    # 平日 JST 7:00 = UTC 22:00（前日）→ 米国市場close後（NY 17:00）
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

jobs:
  backfill-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill S&P 500 daily bars
        run: python scripts/data/backfill_daily_bars.py --index sp500 --yes

      - name: Backfill S&P 600 daily bars
        run: python scripts/data/backfill_daily_bars.py --index sp600 --yes

      - name: Backfill index data (^GSPC, ^VIX)
        run: python scripts/data/backfill_index.py --yes

      - name: Backfill VIX-related ETFs
        run: python scripts/data/backfill_vol_etfs.py

      - name: Backfill rotation ETFs
        run: python scripts/data/backfill_rotation_etfs.py

      - name: Notify Slack on failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "❌ US Daily Backfill 失敗"
          SLACK_MESSAGE: |
            米国データのバックフィルでエラーが発生しました。
            詳細は GitHub Actions ログを確認してください。
          SLACK_COLOR: danger
          SLACK_FOOTER: "auto-us-stock-trader"
