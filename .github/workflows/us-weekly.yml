name: US Weekly Backfill

on:
  schedule:
    # 毎週土曜 JST 8:00 = UTC 23:00（金曜）
    - cron: "0 23 * * 5"
  workflow_dispatch: {}

jobs:
  backfill-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill US earnings dates
        run: python scripts/data/backfill_earnings.py --yes

      - name: Get DB counts
        id: counts
        if: success()
        run: |
          EARNINGS=$(python -c "import os,psycopg2;c=psycopg2.connect(os.environ['DATABASE_URL']).cursor();c.execute('SELECT COUNT(*), MAX(date) FROM auto_us_stock_trader.\"EarningsDate\"');n,d=c.fetchone();print(f'{n:,} rows (max {d})')")
          echo "earnings=$EARNINGS" >> $GITHUB_OUTPUT

      - name: Notify Slack on success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "✅ US Weekly Backfill 成功"
          SLACK_MESSAGE: |
            EarningsDate: ${{ steps.counts.outputs.earnings }}
          SLACK_COLOR: good
          SLACK_FOOTER: "auto-us-stock-trader"

      - name: Notify Slack on failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "❌ US Weekly Backfill 失敗"
          SLACK_MESSAGE: |
            米国決算日データのバックフィルでエラーが発生しました。
            詳細は GitHub Actions ログを確認してください。
          SLACK_COLOR: danger
          SLACK_FOOTER: "auto-us-stock-trader"
