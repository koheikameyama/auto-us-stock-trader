name: Monthly Walk-Forward Evaluation

on:
  schedule:
    # 毎月 1 日 JST 9:00 = UTC 0:00
    - cron: "0 0 1 * *"
  workflow_dispatch: {}

jobs:
  monthly-wf:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run monthly walk-forward evaluation
        run: npm run walk-forward:monthly

      - name: Notify Slack on failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "❌ Monthly Walk-Forward 失敗"
          SLACK_MESSAGE: |
            月次 WF 評価ジョブでエラーが発生しました。
            詳細は GitHub Actions ログを確認してください。
          SLACK_COLOR: danger
          SLACK_FOOTER: "auto-us-stock-trader"
